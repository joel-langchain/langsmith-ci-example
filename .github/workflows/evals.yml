name: agent evals

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: dataset version tag to evaluate against
        default: prod

env:
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  # US by default. Set the LANGSMITH_ENDPOINT repository variable to https://eu.api.smith.langchain.com for an EU workspace.
  LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
  LANGSMITH_PROJECT: ci-evals
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # optional, enables the LLM judge
  DATASET: agent-golden-set
  TAG: ${{ github.event.inputs.tag || 'prod' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 1. The dataset still looks the way the team agreed. Fails the build if not.
      - name: check dataset schema
        run: python -m evals check-schema --dataset "$DATASET" --tag "$TAG"

      # 2. Run the agent over the pinned dataset version and gate on the score.
      #    Calls the AgentCore runtime by ARN unless the AGENT_MODE repository variable
      #    says otherwise: http for any endpoint, or reference (always passes) and
      #    echo (always fails) to check the pipeline without an agent.
      - name: run evals
        env:
          AGENT_MODE: ${{ vars.AGENT_MODE || 'agentcore' }}
          AGENT_RUNTIME_ARN: ${{ secrets.AGENT_RUNTIME_ARN }}
          AGENT_QUALIFIER: DEFAULT
          AWS_REGION: ${{ vars.AWS_REGION }}
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m evals run --dataset "$DATASET" --tag "$TAG" --threshold 0.8 --gate-key keyword_coverage
